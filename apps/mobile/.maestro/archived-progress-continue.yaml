appId: com.flashcardreels.app
---
- launchApp:
    clearState: true
- runFlow: subflows/import-versioned-deck.yaml
- runFlow: subflows/study-and-archive.yaml
- tapOn: Back
- tapOn: Library
- runFlow: subflows/import-versioned-deck.yaml
- assertVisible: Saved learning progress
- tapOn: Continue with saved progress
- assertNotVisible: "Choose progress for Versioned Test Deck"
- tapOn: Versioned Test Deck
- assertVisible: "3 cards"
