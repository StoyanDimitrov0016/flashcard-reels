appId: com.flashcardreels.app
---
- launchApp:
    clearState: true
- runFlow: subflows/import-versioned-deck.yaml
- runFlow: subflows/study-and-archive.yaml
# The archive must survive process restart without its package being installed.
- stopApp
- launchApp
- tapOn: Settings tab
- tapOn: Archived deck progress
- assertVisible: Versioned Test Deck
- assertVisible: "1 review.*"
- tapOn: Back
- runFlow: subflows/import-versioned-deck.yaml
- assertVisible: Saved learning progress
- tapOn: Continue with saved progress
- tapOn: Decks tab
- assertVisible: "1 / 3 reviewed"
# Continuing archived progress must also survive a second cold launch.
- stopApp
- launchApp
- tapOn: Decks tab
- assertVisible: Versioned Test Deck
- assertVisible: "1 / 3 reviewed"
