appId: com.flashcardreels.app
---
- launchApp:
    clearState: true
- runFlow: subflows/import-versioned-deck.yaml
- runFlow: subflows/study-and-archive.yaml
- tapOn: Back
- tapOn: Library tab
- runFlow: subflows/import-versioned-deck.yaml
- assertVisible: Saved learning progress
- tapOn: Delete progress and start fresh
- assertVisible: "Start Versioned Test Deck fresh?"
- tapOn: Delete saved progress
- assertNotVisible: "Choose progress for Versioned Test Deck"
- tapOn: You tab
- tapOn: Archived deck progress
- assertVisible: No archived progress yet.
