name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      # Only this job runs Turborepo, so it alone restores and saves the cache.
      - name: Restore Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-quality-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-quality-
      - run: npm run check
      - run: npm test
      - run: npm run check:dead-code
      - run: npm audit --omit=dev --audit-level=high

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - run: npm run build -w @flashcard-reels/web

  mobile-validation:
    name: Mobile validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - name: Report validated revision and Expo version
        run: |
          git log -1 --format='%h %s'
          node --version
          npm --version
          npm ls expo --workspace @flashcard-reels/mobile --depth=0
      - run: npm run db:check -w @flashcard-reels/mobile
      - run: npm run doctor -w @flashcard-reels/mobile
      - run: npm run check:android -w @flashcard-reels/mobile
